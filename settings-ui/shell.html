<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>whatRust</title><script src="i18n.js"></script><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#0a0a0a;--dim:#626262;--line:#e9ebeb;--hover:#f1f2f2;--accent:#1daa61;font:14px "Segoe UI",Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#161717;--fg:#fafafa;--dim:#a1a5a5;--line:#2c3030;--hover:#2a2d2d;--accent:#21c063}}
:root[data-theme=dark]{color-scheme:dark;--bg:#161717;--fg:#fafafa;--dim:#a1a5a5;--line:#2c3030;--hover:#2a2d2d;--accent:#21c063}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg)}
header{height:48px;min-height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border-bottom:1px solid var(--line)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.account-picker{position:relative;min-width:0;max-width:min(320px,65vw);height:40px;display:flex;align-items:center;border-radius:20px}.account-picker:hover,button:hover{background:var(--hover)}
.account-picker>svg{position:absolute;left:8px;pointer-events:none}.account-picker>.chevron{left:auto;right:8px;width:16px;height:16px}
select,button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer}select{position:absolute;inset:0;width:100%;appearance:none;min-width:0;max-width:100%;height:40px;padding:8px 32px 8px 40px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;border-radius:20px}option{background:var(--bg);color:var(--fg)}
.selected-size{font:inherit;visibility:hidden;white-space:pre;max-width:100%;overflow:hidden;height:40px;padding:8px 32px 8px 40px;pointer-events:none}
button{display:inline-flex;align-items:center;justify-content:center;gap:10px;flex:none;height:40px;min-width:40px;padding:8px 12px;border-radius:20px}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;min-height:0;display:grid;place-content:center;text-align:center;padding:24px}main>svg{width:64px;height:64px;margin:0 auto 24px;color:var(--dim);stroke-width:1}
h1{font-size:24px;font-weight:500;margin:0 0 12px}p{max-width:420px;color:var(--dim);line-height:1.6;margin:0 auto}
@media(max-height:100px){main{display:none}}@media(max-width:480px){#settings span{display:none}#settings{width:40px;padding:8px}}
</style></head><body>
<header aria-label="Controles do whatRust"><div class="account-picker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M13 7a4 4 0 1 1-8 0a4 4 0 0 1 8 0"/></svg><span id="account-size" class="selected-size" aria-hidden="true">Contas</span><select id="accounts" aria-label="Trocar conta do WhatsApp"></select><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></div><button id="settings" type="button" aria-label="Configurações do whatRust" title="Configurações do whatRust"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z M15 12a3 3 0 1 1-6 0a3 3 0 0 1 6 0"/></svg><span>Configurações</span></button></header>
<main><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg><h1>Escolha uma conta para continuar</h1><p>Use o seletor acima para abrir um WhatsApp ou as configurações para gerenciar suas contas.</p></main>
<script src="shell.js"></script></body></html>
