name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libdbus-1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libhunspell-dev patchelf \
            desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Release notes live in the repo (docs/release-notes/<tag>.md) and become
      # the release body, so a release never goes out with an empty page.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo "body<<WHATRUST_NOTES_EOF"
            if [ "$GITHUB_REF_TYPE" = tag ] && [ -f "$f" ]; then cat "$f"; fi
            echo "WHATRUST_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only create a (published) release on a version-tag push; on manual
          # workflow_dispatch, tagName is empty so it just builds (no release
          # named after the branch).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('whatRust {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: ${{ github.ref_type == 'tag' }}
          prerelease: false

      # Issue #22: the bundler copies the build host's libwayland-client into the
      # AppImage, and on any distro with a newer Mesa that old copy stops Mesa's
      # EGL from loading (blank window, EGL_BAD_PARAMETER). Strip the host-only
      # libraries, repack, verify, and replace the asset tauri-action uploaded.
      - name: Strip host-only libraries from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          set -- src-tauri/target/release/bundle/appimage/*.AppImage
          [ -f "$1" ] || { echo "no AppImage was built" >&2; exit 1; }
          for img in "$@"; do
            APPIMAGETOOL="$RUNNER_TEMP/appimagetool" scripts/strip-appimage-libs.sh "$img"
            if [ "$IS_TAG" = true ]; then
              gh release upload "$GITHUB_REF_NAME" "$img" --clobber
            fi
          done

  flatpak:
    name: Flatpak (${{ matrix.variant.arch }})
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: whatRust_${{ matrix.variant.arch }}.flatpak
          manifest-path: io.github.karem505.whatRust.yml
          branch: stable
          cache-key: whatrust-flatpak-${{ matrix.variant.arch }}-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          verbose: true

  publish-flatpak:
    name: Attach Flatpaks to release
    if: github.ref_type == 'tag'
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: whatRust_*-*.flatpak
          path: flatpak-assets
          merge-multiple: true
      - name: Upload Flatpak bundles and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" flatpak-assets/*.flatpak --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
