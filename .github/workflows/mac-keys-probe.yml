name: mac-keys-probe
on:
  workflow_dispatch:
  push:
    branches: [fix/macos-arrow-keys]
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
      - name: build
        working-directory: src-tauri
        run: cargo build --locked
      - name: probe
        run: |
          sw_vers
          mkdir -p out
          (cd .github/probe && PROBE_LOG=$GITHUB_WORKSPACE/out/log.jsonl python3 server.py) &
          sleep 1
          cd out
          swiftc -O ../.github/probe/hwkey.swift -o ../.github/probe/hwkey
          CFG="$HOME/Library/Application Support/com.karem.whatrust"
          mkdir -p "$CFG"
          run_mode() { # name settings-json pre-step
            echo "$2" > "$CFG/settings.json"
            WHATRUST_PROBE_URL="http://127.0.0.1:8765/probe.html?f=ta" ../src-tauri/target/debug/whatrust > app-$1.log 2>&1 &
            sleep 15
            if [ -n "$3" ]; then osascript -e 'tell application "System Events" to keystroke "w" using {command down, shift down}' || true; sleep 3; fi
            screencapture -x shot-$1-pre.png
            PROC=whatrust bash ../.github/probe/keys.sh $1 || true
            cp "$HOME/.local/share/whatRust/logs/whatrust.log" $1.dlog || true
            pkill whatrust || true; sleep 3
          }
          (cd ../.github/probe/wryctl && cargo build --release) || true
          for v in plain child; do
            ../.github/probe/wryctl/target/release/wryctl "http://127.0.0.1:8765/probe.html?f=ta" $v > app-wry-$v.log 2>&1 &
            sleep 8
            PROC=wryctl bash ../.github/probe/keys.sh wry-$v || true
            pkill wryctl || true; sleep 2
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-out
          path: out
