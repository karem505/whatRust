name: mac-keys-probe
on:
  workflow_dispatch:
  push:
    branches: [fix/macos-arrow-keys]
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
      - name: build
        working-directory: src-tauri
        run: cargo build --locked
      - name: probe
        run: |
          sw_vers
          mkdir -p out
          (cd .github/probe && PROBE_LOG=$GITHUB_WORKSPACE/out/log.jsonl python3 server.py) &
          sleep 1
          cd out
          mkdir -p "$HOME/Library/Application Support/com.karem.whatrust"
          echo '{"single_window":true}' > "$HOME/Library/Application Support/com.karem.whatrust/settings.json"
          for f in ta ce; do
            WHATRUST_PROBE_URL="http://127.0.0.1:8765/probe.html?f=$f" ../src-tauri/target/debug/whatrust > app-$f.log 2>&1 &
            sleep 15
            PROC=whatrust bash ../.github/probe/keys.sh single-$f || true
            pkill whatrust || true; sleep 3
          done
          cp "$HOME/Library/Application Support/com.karem.whatrust/settings.json" settings-used.json || true
          ls -R "$HOME/Library/Application Support/com.karem.whatrust" | head -30 > appdata.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-out
          path: out
